<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | MDL — مكتبة بيانات وادي الرافدين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/styles/base.css">
  <link rel="stylesheet" href="../../src/styles/components.css">
  <link rel="stylesheet" href="../../src/styles/pages/auth.css">
  <link rel="stylesheet" href="../../src/styles/responsive.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-panel">
      <h1>تسجيل الدخول</h1>
      <p class="auth-panel__meta">مرحباً بعودتك إلى <a href="../../index.html">MDL</a></p>
      <form class="auth-form">
        <div class="field-group">
          <label for="login-email">البريد الإلكتروني</label>
          <input id="login-email" type="email" placeholder="name@email.com" required>
        </div>
        <div class="field-group">
          <label for="login-password">كلمة المرور</label>
          <input id="login-password" type="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn--primary" type="submit">تسجيل الدخول</button>
      </form>
      <div class="auth-links">
        <a href="forget-password.html">هل نسيت كلمة المرور؟</a>
        <a href="signup.html">إنشاء حساب</a>
      </div>
    </div>
  </main>
  <script src="../../src/scripts/main.js"></script>
</body>
</html>
